name = "aletheia-telegram-bot"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
ALLOWED_USER_ID = "9047800237"   # pegue com o @userinfobot
GITHUB_REPO = "Elliton-Luis/aletheia-blog"          # dono/repositório
GITHUB_BRANCH = "main"
CONTENT_PATH = "src/content/articles"               # pasta dos ensaios no repo do blog
SITE_URL = "https://blog-aletheia.vercel.app"                # ex.: https://aletheia-blog.vercel.app (sem / no fim)

[[kv_namespaces]]
binding = "KV"
id = "049ded3b0e6348eeb40c04263da04d86"

[triggers]
crons = ["* * * * *"]   # a cada minuto, verifica exclusões agendadas pelo /deletar
